<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Giggle - Create</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
<!-- Content -->
    <div class="container">
        <h1 id="form-title">Create</h1>

        <form class="form" id="post-form">
            <input
                id="title"
                type="text"
                placeholder="Title"
            >

            <textarea
                id="description"
                placeholder="Write your post..."
            ></textarea>

            <div class="button-group">
                <button type="submit" id="submit-button">
                    Create
                </button>

                <a href="../index.html" class="link-button">
                    Cancel
                </a>
            </div>
        </form>
    </div>
    
    <!-- Footer -->
    <div class="footer">
            Made with <b>&lt;3</b> by
            <a href="https://osdc.dev">
                <img
                src="https://links.osdc.dev/assets/logo-pixel.svg"
                alt="OSDC"
                height="18"
                >
            </a>
    </div>

    <script src="../scripts/script.js"></script>
</body>
</html>
